<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Border Style</title>
    <style>
      header {
        border-bottom: 4px double blue;
      }
      footer {
        border-top: 4px dashed gray;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Latihan Border Style</h1>
    </header>
    <article>
      <p>
        Ini adalah contoh border style di CSS. Border style digunakan untuk
        mengatur gaya garis tepi pada elemen HTML.
      </p>
    </article>
    <footer>Copyright &copy; 2025 pepeelge</footer>
  </body>
</html>
