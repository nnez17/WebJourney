<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan CSS Border - Sisi</title>
    <style>
      header {
        border-bottom: 4px solid black;
        padding: 10px;
        text-align: center;
        background-color: #f2f2f2;
      }
      main {
        border: 2px dashed blue;
        padding: 15px;
        margin: 20px 0;
        background-color: #e6f7ff;
      }
      footer {
        border-top: 3px dotted green;
        padding: 10px;
        text-align: center;
        background-color: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Latihan CSS Border untuk sisi tertentu</h1>
    </header>

    <main>
      <p>
        Hello World! Ini adalah latihan untuk menambahkan border pada sisi
        tertentu menggunakan CSS.
      </p>
    </main>
    <footer>
      <p>Copyright &copy; pepeelge 2025</p>
    </footer>
  </body>
</html>
