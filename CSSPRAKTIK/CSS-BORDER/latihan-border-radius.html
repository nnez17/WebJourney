<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Border Radius</title>
    <style>
      header {
        border: 2px solid black;
        border-radius: 10px;
      }
      article {
        border: 2px solid black;
        border-radius: 10px;
      }
      footer {
        border: 2px solid black;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Latihan Border Radius</h1>
    </header>
    <article>
      <p>
        Ini adalah contoh border radius di CSS. Border radius digunakan untuk
        mengatur sudut tepi pada elemen HTML.
      </p>
    </article>
    <footer>&copy; 2025 pepeelge</footer>
  </body>
</html>
