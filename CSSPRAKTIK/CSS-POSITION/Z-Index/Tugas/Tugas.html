<!doctype html>
<html>
  <head>
    <title>Tugas Z-Index</title>
    <style>
      .container {
        position: relative;
        margin-top: 50px;
      }

      img {
        position: absolute;
        width: 200px;
        border: 2px solid black;
      }
      .gambar1 {
        z-index: 3;
        top: 100px;
        left: 100px;
      }
      .gambar2 {
        z-index: 2;
        top: 50px;
        left: 50px;
      }
      .gambar3 {
        z-index: 1;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <h2>Tugas Z-Index Tiga Gambar</h2>
    <div class="container">
      <img src="gokil.jpg" class="gambar1" alt="Gambar 1" />
      <img src="gokil.jpg" class="gambar2" alt="Gambar 2" />
      <img src="gokil.jpg" class="gambar3" alt="Gambar 3" />
    </div>
  </body>
</html>
