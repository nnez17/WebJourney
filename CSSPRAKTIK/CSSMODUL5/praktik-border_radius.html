<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      p {
        border: 2px solid black;
        border-radius: 25px;
        padding: 20px;
        width: 200px;
        text-align: center;
      }
      #p1 {
        border-radius: 25px;
      }
      #p2 {
        border-radius: 25px 50px;
      }
      #p3 {
        border-radius: 25px 50px 75px;
      }
      #p4 {
        border-radius: 25px 50px 75px 100px;
      }
    </style>
  </head>
  <body>
    <p>Border Radius</p>
    <p id="p4"></p>
    <p id="p3"></p>
    <p id="p2"></p>
    <p id="p1"></p>
  </body>
</html>
