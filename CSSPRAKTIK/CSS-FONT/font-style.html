<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Style</title>
    <style>
      .style-normal {
        font-style: normal;
      }
      .style-italic {
        font-style: italic;
      }
      .style-oblique {
        font-style: oblique;
      }
    </style>
  </head>
  <body>
    <p class="style-normal">Normal Font Style</p>
    <p class="style-italic">Italic Font Style</p>
    <p class="style-oblique">Oblique Font Style</p>
  </body>
</html>
