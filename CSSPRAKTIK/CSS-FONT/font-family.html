<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Family</title>
    <style>
      .font-arial {
        font-family: Arial, sans-serif;
      }
      .font-times {
        font-family: "Times New Roman", serif;
      }
      .font-courier {
        font-family: "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <p class="font-arial">Arial Font Family</p>
    <p class="font-times">Times New Roman Font Family</p>
    <p class="font-courier">Courier New Font Family</p>
  </body>
</html>
