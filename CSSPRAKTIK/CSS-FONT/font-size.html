<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font STyle</title>
    <style>
      .px {
        font-size: 20px;
      }
      .em {
        font-size: 2em;
      }
      .rem {
        font-size: 2rem;
      }
      .percent {
        font-size: 150%;
      }
    </style>
  </head>
  <body>
    <div class="px">Font style dengan satuan pixel (px)</div>
    <div class="em">Font Style dengan satuan em</div>
    <div class="rem">Font Style dengan satuan rem</div>
    <div class="percent">Font Style dengan satuan persen (%)</div>
  </body>
</html>
