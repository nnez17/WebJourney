<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palet Warna</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Palet Warna Favorit Saya</h1>
    </header>
    <div class="konten">
      <div class="warna" style="background-color: red">
        <p>Nama Warna</p>
      </div>
      <div class="warna" style="background-color: #33ff57">
        <p>Hex</p>
      </div>
      <div class="warna" style="background-color: rgb(0, 0, 255)">
        <p>RGB</p>
      </div>
      <div class="warna" style="background-color: hsl(60, 100%, 50%)">
        <p>HSL</p>
      </div>
      <div class="warna" style="background-color: rgba(0, 255, 128, 0.5)">
        <p>RGBA</p>
      </div>
      <div>
        <div class="warna" style="background-color: hsla(308, 59%, 47%, 0.5)">
          <p>HSLA</p>
        </div>
      </div>
    </div>
    <footer>
      <p>Copyright &copy; 2025 Noval Akbar</p>
    </footer>
  </body>
</html>
